<app-mobile-navigation [language]="language()" (languageChange)="setLanguage($event)" />
<main class="site-main">
<section class="hero" id="home" #hero>

  <div class="layer sky">
    <img loading="eager" decoding="async" id="skyM" alt="" src="https://images.higgs.ai/?default=1&amp;output=webp&amp;url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261102_040343_a73684b4-3f71-4613-a843-c8be80fb1211.png&amp;w=1600&amp;q=80">
    
    <img loading="eager" decoding="async" id="skyN" alt="" src="https://images.higgs.ai/?default=1&amp;output=webp&amp;url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261102_040308_f31964ab-ed8e-4ea4-90eb-3226c0859936.png&amp;w=1600&amp;q=80">
  </div>

  <div class="layer home">

    <div class="set" id="setM" #setM>
      <div class="layer ground">
        <img loading="eager" decoding="async" alt="" src="https://images.higgs.ai/?default=1&amp;output=webp&amp;url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261102_040259_1be34093-835e-4de4-b3a8-f875e6a74591.png&amp;w=2560&amp;q=85">
      </div>

      <img loading="eager" decoding="async" class="cut"
        [alt]="copy().morningAlt"
        src="https://images.higgs.ai/?default=1&amp;output=webp&amp;url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261102_040416_e3b05fa4-cc80-4a43-afde-8a0a053933e9.png&amp;w=2560&amp;q=85"
        style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%">
    </div>

    <div class="set is-on" id="setN" #setN>
      <div class="layer ground">
        <img loading="eager" decoding="async" alt="" src="https://images.higgs.ai/?default=1&amp;output=webp&amp;url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261102_040211_c8fd4865-285e-4c1f-8a37-4bfe0771357b.png&amp;w=2560&amp;q=85">
      </div>

      <img loading="eager" decoding="async" class="cut"
        [alt]="copy().nightAlt"
        src="https://images.higgs.ai/?default=1&amp;output=webp&amp;url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261102_040415_2ab95096-8c39-449f-b36c-17c2813815a4.png&amp;w=2560&amp;q=85"
        style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%">
    </div>

  </div>

  <div class="tilt"></div>

  <canvas #fog id="fog" aria-hidden="true"></canvas>

  <div class="ui">

    <header class="bar">

      <a class="logo" href="#home" aria-label="Voltmont">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <g fill="color-mix(in srgb,#6d8f2a calc((1 - var(--k))*100%),#d8ee8e)">
            <circle cx="20" cy="20" r="0"/>
            <path id="ray" d="M18.3 3.5h3.4l.9 8.4h-5.2Z"/>
            <use href="#ray" transform="rotate(30 20 20)"/>
            <use href="#ray" transform="rotate(60 20 20)"/>
            <use href="#ray" transform="rotate(90 20 20)"/>
            <use href="#ray" transform="rotate(120 20 20)"/>
            <use href="#ray" transform="rotate(150 20 20)"/>
            <use href="#ray" transform="rotate(180 20 20)"/>
            <use href="#ray" transform="rotate(210 20 20)"/>
            <use href="#ray" transform="rotate(240 20 20)"/>
            <use href="#ray" transform="rotate(270 20 20)"/>
            <use href="#ray" transform="rotate(300 20 20)"/>
            <use href="#ray" transform="rotate(330 20 20)"/>
          </g>
        </svg>
        Voltmont
      </a>

      <ul class="links">
        <li><a href="#how-it-works">{{ copy().how }}</a></li>
        <li><a href="#projects">{{ copy().projects }}</a></li>
        <li><a href="#about">{{ copy().about }}</a></li>
        <li><a href="#process">{{ language() === 'bs' ? 'Ugradnja' : 'Installation' }}</a></li>
        <li><a href="#faq">{{ copy().resources }}</a></li>
      </ul>

      <div class="side">
        <a class="customers" href="#faq">FAQ</a>
        <a class="contact" href="#contact">{{ copy().contact }}</a>
        <div class="language" role="group" aria-label="Jezik / Language">
          <button type="button" (click)="setLanguage('bs')" [attr.aria-pressed]="language() === 'bs'" aria-label="Bosanski">BS</button>
          <span aria-hidden="true">/</span>
          <button type="button" (click)="setLanguage('en')" [attr.aria-pressed]="language() === 'en'" aria-label="English">EN</button>
        </div>
      </div>

    </header>

    <h1>
      <span class="l1">{{ copy().headline }}</span>
      <span class="l2">{{ copy().continuation }}</span>
    </h1>

    <div class="dock">

      <div class="toggle" role="group" [attr.aria-label]="copy().time">

        <button id="bm" #morningButton type="button" (click)="pick(0)" aria-pressed="false">
          <b>{{ copy().morning }}</b>
          <small>{{ copy().morningCaption }}</small>
        </button>

        <button id="bn" #nightButton type="button" (click)="pick(1)" aria-pressed="true">
          <b>{{ copy().night }}</b>
          <small>{{ copy().nightCaption }}</small>
        </button>

      </div>

      <p class="cap">{{ copy().caption }}</p>

    </div>

  </div>

</section>
<app-site-sections [language]="language()"></app-site-sections>
</main>
