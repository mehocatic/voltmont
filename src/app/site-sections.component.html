<div class="story">










  <section class="contact-section section" id="contact" aria-labelledby="contact-heading">
    <div class="shell" data-reveal>
      <span class="eyebrow">06 / {{ t().contactTag }}</span>
      <div class="contact-layout"><h2 id="contact-heading">{{ t().contactTitle }}</h2><div class="contact-copy"><p>{{ t().contactText }}</p><a class="email-link" [href]="mailto()">{{ t().email }} <span aria-hidden="true">↗</span></a><a class="email-address" [href]="mailto()">{{ emailAddress }}</a><small>{{ t().demo }}</small></div></div>
      <div class="footer"><a class="footer-logo" href="#home"><span aria-hidden="true">✳</span> Voltmont</a><p>{{ t().region }}<br>{{ t().rights }}</p><a class="back-top" href="#home">{{ t().top }} ↑</a></div>
    </div>
  </section>
</div>
